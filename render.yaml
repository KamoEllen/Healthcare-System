services:
  - type: web
    name: healthcare-api
    env: node
    plan: free
    buildCommand: cd server && npm ci && npm run build
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: EMAIL_PROVIDER
        value: mailtrap
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: noreply@healthcare.dev
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_API_MAX
        value: "100"

databases:
  - name: healthcare-db
    plan: free
    postgresVersion: "15"
